    <div class="row" style="justify-content:space-between">Бағдарламашымын <span id="n_tog" style="width:42px;height:22px;border-radius:11px;border:2.5px solid #1d1d2b;background:#ccc;position:relative;display:inline-block"><i id="n_knob" style="position:absolute;top:1.5px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;border:2px solid #1d1d2b"></i></span></div>
    <div class="row el" id="n_ok" style="position:relative;justify-content:space-between">Дайын жобаны қолдану <span style="width:24px;height:24px;border-radius:50%;background:#2FA866;border:2.5px solid #1d1d2b;display:flex;align-items:center;justify-content:center">${IC.check}</span></div></div></div>
  <div class="el pill" id="n_st" style="left:150px;top:314px;background:#2FA866;color:#fff;font-size:14px">бәрібір болады!</div>`,
  [['#n_win',0.05,0],['#n_ok','пайдалана',0,'row'],['#n_st','аласыз',-5]]];
 case 'connect': return [`
  <svg class="el" id="c_ln" style="left:0;top:0" width="360" height="640"><path id="c_p1" d="M92 262 H138" stroke="#1d1d2b" stroke-width="3.5" stroke-dasharray="7 6" fill="none"/><path id="c_p2" d="M232 262 H272" stroke="#1d1d2b" stroke-width="3.5" stroke-dasharray="7 6" fill="none"/></svg>
  <div class="el stk" id="c_gh" style="left:16px;top:226px;width:78px;height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;padding:4px">${IC.folder(30)}GitHub</div>
  <div class="el stk" id="c_cc" style="left:136px;top:222px;width:98px;height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;padding:4px;background:#FBE3D6">${IC.spark}Claude Code</div>
  <div class="el" id="c_ph" style="left:278px;top:212px">${IC.phone}</div>
  <div class="el pill" id="c_m" style="left:120px;top:318px;background:#E5322D;color:#fff;font-size:14px">монтаж ✓</div>`,
  [['#c_gh','github',-4],['#c_cc','claude',3],['#c_ph','телефон',6],['#c_m','монтаж',-4],['#c_ln','claude',0,'fade']]];
 case 'cta': return [`
  <div class="el win" id="k_win" style="left:30px;top:204px;width:300px">
   <div class="bar">○○○ толық ақпарат</div>
   <div style="padding:10px 12px;font:800 13px/1.3 MS">Телефоннан монтаж:<br>GitHub + Claude Code</div></div>
  <div class="el" id="k_btn" style="left:60px;top:290px;width:240px;height:46px;border-radius:12px;background:#E5322D;border:3.5px solid #1d1d2b;box-shadow:4px 4px 0 #1d1d2b;color:#fff;font:900 19px/39px MS;text-align:center">Подробнее ›</div>
  <div class="el" id="k_hand" style="left:236px;top:312px">${IC.hand}</div>`,
  [['#k_win',0.05,-2],['#k_btn','подробнее',0,'btn'],['#k_hand','батырмасын',0,'tap']]];
 }
}

function wtime(s,key){
 if(typeof key==='number') return s.t0+key;
 for(const w of s.words){ if(w.w.toLowerCase().includes(key)) return w.t; }
 return s.t0+0.2;
}

function setup(data){
 D=data; const root=$('#scenes'); const dots=$('#dots');
 D.scenes.forEach((s,i)=>{
  const div=document.createElement('div'); div.className='scene'; div.style.display='none';
  const lab=`<div class="lab">// ${s.label}</div>`;
  const hl='<div class="hl">'+s.words.map((w,j)=>`<span data-j="${j}">${w.e?`<b class="e">${w.w}</b>`:w.w}${w.p||''}${j<s.words.length-1?' ':''}</span>`).join('')+'</div>';
  const [html,els]=card(s.card,i);
  div.innerHTML=lab+hl+'<div class="cards" style="position:absolute;inset:0">'+html+'</div>'; root.appendChild(div);
  div.style.display='';const hb=div.querySelector('.hl').getBoundingClientRect().bottom;div.style.display='none';
  const sh=Math.max(-60,hb+18-196);div.querySelector('.cards').style.transform=`translateY(${sh}px)`;
  s.div=div; s.spans=[...div.querySelectorAll('.hl span')];
  s.els=els.map(([sel,key,rot,kind])=>({el:div.querySelector(sel),t:wtime(s,key),rot:rot||0,kind:kind||'pop'}));
  dots.appendChild(document.createElement('i'));
 });
 window.READY=true;
}

function env(t){const i=Math.floor(t*D.fps);return D.env[Math.max(0,Math.min(D.env.length-1,i))]||0}

function drawCat(t,pose,sceneT){
 const a=env(t), a2=env(t-0.05);
 const m=Math.max(a,a2*0.8);
 const open=2+30*m;
 $('#mouth').setAttribute('d',`M170 520 Q190 ${520+open} 210 520 Q190 ${520+Math.min(5,open*0.2)} 170 520Z`);
 $('#tongue').setAttribute('d',open>12?`M180 ${520+open*0.55} Q190 ${520+open*0.95} 200 ${520+open*0.55}Z`:'');
 // blink
 const bp=(t+0.7)%3.3; const blink=bp<0.12;
 $('#eyes').style.display=blink?'none':''; $('#lidL').style.display=blink?'':'none'; $('#lidR').style.display=blink?'':'none';
 // eyes look up to cards a bit
 const lx=Math.sin(t*0.7)*1.5, ly=-2.5;
 document.querySelectorAll('.pup').forEach(p=>p.setAttribute('transform',`translate(${lx} ${ly})`));
 const wow = pose==='wow';
 $('#eyeL').setAttribute('transform', wow?'translate(160 480) scale(1.12) translate(-160 -480)':'');
 $('#eyeR').setAttribute('transform', wow?'translate(220 480) scale(1.12) translate(-220 -480)':'');
 // head bob
 const rot=Math.sin(t*2.1)*2.2+(a-0.3)*3, dy=Math.sin(t*4.2)*1.2-a*3;
 $('#head').setAttribute('transform',`translate(0 ${dy}) rotate(${rot} 190 560)`);
 const tw=((t+1.3)%4.1)<0.18?-10:0;
 $('#earL').setAttribute('transform',`rotate(${tw} 140 430)`);
 $('#earR').setAttribute('transform',`rotate(${-tw*0.5} 240 430)`);
 // body breathe
 $('#catall').setAttribute('transform',`translate(0 ${Math.sin(t*1.6)*1.5})`);
 // arms
 const show=(id,v)=>$(id).style.display=v?'':'none';
 show('#pThumb',pose==='thumb'); show('#pOpen',pose==='wave'||pose==='talk'||pose==='wow'); show('#pPoint',pose==='point'||pose==='down');
 show('#armL',pose==='wow');
 let hx=292,hy=572,hr=0;
 const k=eob(clamp(sceneT/0.4));
 if(pose==='wave'){hr=Math.sin(t*9)*16; hy=566;}
 else if(pose==='talk'){hy=600-14*k-a*10; hx=296; hr=Math.sin(t*3)*6;}
 else if(pose==='point'){hy=560+(1-k)*30+Math.sin(t*5)*2; hr=-6;}
 else if(pose==='thumb'){hy=574+(1-k)*30; hr=Math.sin(t*6)*4;}
 else if(pose==='wow'){hy=560+(1-k)*30; hr=Math.sin(t*7)*8; $('#pawL').setAttribute('transform',`translate(74 ${556+(1-k)*30}) rotate(${-Math.sin(t*7)*8})`);}
 else if(pose==='down'){hy=600+Math.sin(t*8)*4; hx=300; hr=180;}
 $('#pawR').setAttribute('transform',`translate(${hx} ${hy}) rotate(${hr})`);
 const ad=`M300 660 L${hx+2} ${hy+(pose==='down'?-14:22)}`;
 $('#armRline').setAttribute('d',ad); $('#armRfill').setAttribute('d',ad);
}

function draw(t){
 let cur=0; D.scenes.forEach((s,i)=>{ if(t>=s.t0) cur=i; });
 // shake on hook start
 const sh=t<0.3?Math.sin(t*90)*(0.3-t)*10:0;
 $('#stage').style.transform=`translate(${sh}px,${sh*0.4}px)`;
 [...$('#dots').children].forEach((d,i)=>d.className=i<cur?'on':i===cur?'cur':'');
 D.scenes.forEach((s,i)=>{
  if(i!==cur){s.div.style.display='none';return}
  s.div.style.display='';
  const end=s.t1, xo=clamp((t-(end-0.16))/0.16);
  s.div.style.opacity=1-xo; s.div.style.transform=`scale(${1-0.04*xo})`;
  const hook=i===0;
  s.spans.forEach((sp,j)=>{
   const w=s.words[j]; const p=clamp((t-w.t)/(hook?0.28:0.16));
   if(t<w.t){ sp.style.opacity=hook?0:0.2; sp.style.transform=hook?'scale(.4)':'none'; }
   else if(hook){ sp.style.opacity=clamp(p*3); sp.style.transform=`scale(${0.4+0.6*eob(p)}) translateY(${(1-eo(p))*8}px)`; }
   else { sp.style.opacity=0.2+0.8*eo(p); sp.style.transform=`translateY(${(1-eo(p))*-3}px)`; }
  });
  s.els.forEach(o=>{
   const p=clamp((t-o.t)/0.38);
   if(t<o.t){o.el.style.opacity=0;o.el.style.transform=`scale(.5) rotate(${o.rot}deg)`;return}
   let sc=0.5+0.5*eob(p), extra='';
   if(o.kind==='row'){o.el.style.opacity=eo(p);o.el.style.transform=`translateX(${(1-eo(p))*-24}px)`;return}
   if(o.kind==='fade'){o.el.style.opacity=eo(p);o.el.style.transform='none';
     s.div.querySelectorAll('#c_p1,#c_p2').forEach(q=>q.style.strokeDashoffset=-t*30);return}
   if(o.kind==='slide'){o.el.style.opacity=eo(p);o.el.style.transform=`translate(${(1-eo(p))*-110}px,${(1-eo(p))*-40}px) rotate(${o.rot*eo(p)}deg)`;return}
   if(o.kind==='q') extra=` rotate(${Math.sin(t*6)*8}deg)`;
   if(o.kind==='btn'){ const pu=1+0.05*Math.sin(t*7); sc*=pu; }
   if(o.kind==='tap'){ const c=((t-o.t)%1.0); const press=c<0.15?c/0.15:c<0.3?1-(c-0.15)/0.15:0;
     o.el.style.opacity=eo(p); o.el.style.transform=`translate(${-press*6}px,${-press*10+ (1-eo(p))*40}px) scale(${1-press*0.08})`; return}
   o.el.style.opacity=clamp(p*3); o.el.style.transform=`scale(${sc}) rotate(${o.rot}deg)${extra}`;
  });
  // scene-specific state
  if(s.card==='starfork'){
   const ts=wtime(s,'star'), tf=wtime(s,'fork');
   const on=t>=ts; s.div.querySelector('#s_ic').innerHTML=IC.star(on?'#F7C948':'#fff');
   s.div.querySelector('#s_n').textContent=on?'128':'127';
   const ps=clamp((t-ts)/0.3), pf=clamp((t-tf)/0.3);
   s.div.querySelector('#s_star').style.transform=`scale(${on?1+0.25*Math.sin(Math.PI*ps):1})`;
   s.div.querySelector('#s_star').style.background=on?'#FFF4C9':'#fff';
   s.div.querySelector('#s_fork').style.transform=`scale(${t>=tf?1+0.25*Math.sin(Math.PI*pf):1})`;
   s.div.querySelector('#s_fork').style.background=t>=tf?'#d9f2e3':'#fff';
  }
  if(s.card==='noprog'){
   const tb=wtime(s,'бағдарламашы'); const on=t>=tb;
   s.div.querySelector('#n_tog').style.background='#ccc';
   const sh2=on&&t<tb+0.5?Math.sin((t-tb)*40)*3:0;
   s.div.querySelector('#n_tog').style.transform=`translateX(${sh2}px)`;
  }
 });
 drawCat(t,D.scenes[cur].pose,t-D.scenes[cur].t0);
}
window.setup=setup; window.draw=draw;
</script></body></html>
